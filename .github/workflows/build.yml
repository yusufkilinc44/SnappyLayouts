name: Build Snappy Layout (.NET 10 WPF)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restore dependencies
        run: dotnet restore "Snappy Layout.sln"

      - name: Build Release
        run: dotnet build "Snappy Layout.sln" --configuration Release --no-restore

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snappy-Layout-Release
          path: src/Snappy Layout/bin/Release/net10.0-windows/
